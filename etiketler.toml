# Konu etiketleri — bu dosyayı serbestçe düzenleyebilirsin.
#
# Her etiket için:
#   ad        : sitede görünecek ad
#   aciklama  : modele verilen tek cümlelik tanım (model yalnız bu listeden seçer)
#   kelimeler : başlıkta ya da kurum adında geçerse etiket model sormadan eklenir
#               (büyük/küçük harf fark etmez; kelimenin başı eşleşir: "vergi" → "vergilendirme")
#
# Etiket eklemek/silmek için bölümü ekle/sil. Anahtar (köşeli parantez içi) adreslerde kullanılır;
# sonradan değiştirirsen eski sayfaların etiket adresi değişir.
# Değişiklikten sonra: python3.12 -m gazete.ozetle etiketle --hepsi

[bankacilik-finans]
ad = "Bankacılık ve finans"
aciklama = "Bankalar, kredi, ödeme hizmetleri, elektronik para, sigorta, Merkez Bankası, kambiyo."
kelimeler = ["banka", "bddk", "merkez bankası", "kredi", "ödeme hizmet", "elektronik para", "sigorta",
             "kambiyo", "finansal kiralama", "faktoring", "katılım bank"]

[sermaye-piyasasi]
ad = "Sermaye piyasası"
aciklama = "Borsa, menkul kıymetler, yatırım fonları, halka açık şirketler, SPK düzenlemeleri."
kelimeler = ["sermaye piyasası", "spk", "borsa", "menkul kıymet", "yatırım fonu", "portföy", "kripto varlık"]

[vergi]
ad = "Vergi"
aciklama = "Vergi, resim, harç, gümrük vergisi, KDV, ÖTV ve vergi usulü."
kelimeler = ["vergi", "kdv", "katma değer", "özel tüketim", "harç", "resim ve harç", "gelir idaresi", "vuk"]

[kvkk]
ad = "Kişisel veriler (KVKK)"
aciklama = "Kişisel verilerin korunması, veri sorumluları, veri güvenliği."
kelimeler = ["kişisel veri", "kvkk"]

[is-sgk]
