# Gazete Özeti — yalnız ev ağı / tailnet. data/web/current → son üretilen site klasörü (sembolik bağ).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/web/current;
    index index.html;
    charset utf-8;
    charset_types text/css application/json application/rss+xml text/xml;
    disable_symlinks off;
    absolute_redirect off;   # yönlendirmeler port numarasını (8080) korusun
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ~ \.xml$ { types { } default_type "application/rss+xml; charset=utf-8"; }
    # GitHub Pages kopyası /resmi-gazete-ozeti/ altında; bağlantılar bu kökle üretilir, LAN'da da çalışsın
    location = / { return 302 /resmi-gazete-ozeti/; }
    location /resmi-gazete-ozeti/ {
        rewrite ^/resmi-gazete-ozeti/$ /index.html last;
        rewrite ^/resmi-gazete-ozeti(/.*)$ $1 last;
    }
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
}
